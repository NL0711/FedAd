<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FedAd Contributor</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>FedAd Contributor</h1>

  <section id="consent">
    <p>Reads the pages you open, on this device only, to learn which topics you click on. Only a clipped, noised model update is ever sent:
    no pages, no addresses, no site names.</p>
    <label class="row"><input type="checkbox" id="agree"> I agree</label>
  </section>

  <section id="main" hidden>
    <p id="status"></p>
    <p id="msg" role="status"></p>
    <button id="retry" hidden>Try again</button>
    <button id="wipe" class="danger">Delete my data</button>
  </section>
  <script type="module" src="popup.js"></script>
</body>
</html>
