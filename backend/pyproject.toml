[project]
name = "fedad"
version = "0.1.0"
description = "Federated learning + differential privacy for ad click prediction (reference implementation of Li, Lin, Zhang, AIFM '25). Prototype."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]
deep = ["torch>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedad"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
