[project]
name = "fedad"
version = "0.1.0"
description = "Federated learning + differential privacy for ad click prediction (reference implementation of Li, Lin, Zhang, AIFM '25). Prototype."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx", "dp-accounting"]
flower = ["flwr>=1.44", "ray>=2.31"]          # Flower runtime for the federated rounds (fedad.flower_engine)
web = ["fastapi", "uvicorn", "pydantic>=2", "pyjwt[crypto]", "psycopg[binary]>=3.1"]   # dashboard API (python -m fedad.web); psycopg only used when DATABASE_URL is set
plots = ["matplotlib>=3.8"]                    # report figures (python -m fedad.experiments)
all = ["fedad[dev,flower,web,plots]", "torch"]
deep = ["torch>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedad"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers =["slow: starts a Ray cluster (about 25 s); run with -m slow, skip with -m 'not slow'"]
