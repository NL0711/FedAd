# Render Blueprint: one web service runs the backend and serves both web pages.
# DEMO: the admin endpoints have no login (FEDAD_OPEN_ADMIN=1); anyone with the URL can use the console and reset the campaign.
services:
  - type: web
    name: fedad
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: FEDAD_OPEN_ADMIN
        value: "1"
