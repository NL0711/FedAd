# Render Blueprint: the backend API (and, if you want, the built pages). The static pages are normally served from Vercel.
# Sign-in is Supabase Auth: the backend only needs the (public) project URL to check tokens. There are no passwords or keys here.
services:
  - type: web
    name: fedad
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        value: https://ystailcfsejrtmivhulc.supabase.co
      # The Supabase session pooler string with your database password. Not stored here: Render asks for it (sync: false).
      # Format: postgresql://postgres.ystailcfsejrtmivhulc:<password>@aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      - key: FEDAD_MIN_COHORT
        value: "10"
