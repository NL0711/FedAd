<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FedAd</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f6f4; color: #1a1a1a;
             font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: min(360px, 92vw); background: #fff; border: 1px solid #e3e3df; border-radius: 12px; padding: 28px; }
      h1 { margin: 0 0 20px; font-size: 26px; letter-spacing: -0.02em; }
      label { display: block; margin: 12px 0; font-size: 13px; color: #555; }
      input { display: block; width: 100%; margin-top: 4px; padding: 10px; font: inherit; border: 1px solid #c9c9c4; border-radius: 8px; }
      input:focus-visible, button:focus-visible { outline: 2px solid #1a1a1a; outline-offset: 2px; }
      button { width: 100%; margin-top: 8px; padding: 11px; font: inherit; color: #fff; background: #1a1a1a; border: 0; border-radius: 8px; cursor: pointer; }
      button:disabled { opacity: .6; cursor: default; }
      #err { min-height: 1.5em; margin: 12px 0 0; color: #b00020; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>FedAd</h1>
      <form id="f">
        <label>Username <input id="u" name="username" autocomplete="username" required autofocus /></label>
        <label>Password <input id="p" name="password" type="password" autocomplete="current-password" required /></label>
        <button id="b" type="submit">Sign in</button>
        <p id="err" role="alert"></p>
      </form>
    </main>
    <script type="module" src="/src/login.ts"></script>
  </body>
</html>
